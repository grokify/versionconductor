name: Go Dependency Auto-Merge

on:
  schedule:
    # Run every 15 minutes, offset from :00 to reduce load
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to evaluate immediately (skips age check)'
        required: false
        type: string
      dry-run:
        description: 'If true, only evaluate but do not merge'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    uses: plexusone/.github/.github/workflows/go-dependency-automerge.yaml@main
    with:
      pr: ${{ inputs.pr || '' }}
      profile: 'quarantine'
      min-age-days: 5
      allowed-authors: 'dependabot[bot],renovate[bot]'
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
